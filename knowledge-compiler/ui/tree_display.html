<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Tree - All Parts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #242836;
  --text: #e4e4e7; --text2: #a1a1aa; --text3: #71717a;
  --accent: #6366f1; --accent2: #818cf8;
  --green: #22c55e; --yellow: #eab308; --orange: #f97316; --red: #ef4444;
  --border: #2e3345; --radius: 8px;
}
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
  background: var(--bg); 
  color: var(--text); 
  height: 100vh; 
  overflow: hidden; 
}
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar { 
  width: 450px; 
  min-width: 320px; 
  background: var(--bg2); 
  border-right: 1px solid var(--border); 
  display: flex; 
  flex-direction: column; 
}
.header { 
  padding: 16px 12px; 
  border-bottom: 1px solid var(--border); 
}
.header h1 { 
  font-size: 16px; 
  font-weight: 700; 
  margin-bottom: 8px; 
}
.stats { 
  padding: 8px 0; 
  font-size: 12px; 
  color: var(--text3); 
  display: flex; 
  gap: 16px; 
  flex-wrap: wrap;
}
.stats span { 
  display: flex; 
  align-items: center; 
  gap: 4px; 
}
.tree-container { 
  flex: 1; 
  overflow-y: auto; 
  padding: 8px 0; 
}
.tree-container::-webkit-scrollbar { width: 6px; }
.tree-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Tree nodes */
.tree-node { 
  user-select: none; 
}
.node-row { 
  display: flex; 
  align-items: center; 
  padding: 4px 12px 4px 0; 
  cursor: pointer; 
  border-radius: 0 var(--radius) var(--radius) 0; 
  transition: background 0.15s; 
}
.node-row:hover { background: var(--bg3); }
.node-row.active { background: rgba(99,102,241,0.15); }
.toggle { 
  width: 20px; 
  height: 20px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 10px; 
  color: var(--text3); 
  flex-shrink: 0; 
  transition: transform 0.2s; 
  cursor: pointer;
}
.toggle.open { transform: rotate(90deg); }
.toggle.leaf { visibility: hidden; }
.level-dot { 
  width: 8px; 
  height: 8px; 
  border-radius: 50%; 
  margin-right: 8px; 
  flex-shrink: 0; 
}
.level-1 .level-dot { background: var(--accent); }
.level-2 .level-dot { background: var(--green); }
.level-3 .level-dot { background: var(--yellow); }
.level-4 .level-dot { background: var(--orange); }
.level-5 .level-dot { background: var(--red); }
.node-title { 
  font-size: 13px; 
  white-space: nowrap; 
  overflow: hidden; 
  text-overflow: ellipsis; 
  flex: 1; 
}
.level-1 .node-title { 
  font-weight: 600; 
  font-size: 14px; 
}
.children { 
  display: none; 
}
.children.open { 
  display: block; 
}

/* Detail panel */
.detail { 
  flex: 1; 
  overflow-y: auto; 
  padding: 24px; 
  background: var(--bg);
}
.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.detail-empty { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  height: 100%; 
  color: var(--text3); 
  font-size: 14px; 
}
.detail-header { 
  margin-bottom: 20px; 
}
.detail-level { 
  display: inline-block; 
  font-size: 11px; 
  padding: 2px 8px; 
  border-radius: 4px; 
  margin-bottom: 8px; 
}
.detail-level.l1 { background: rgba(99,102,241,0.15); color: var(--accent2); }
.detail-level.l2 { background: rgba(34,197,94,0.15); color: var(--green); }
.detail-level.l3 { background: rgba(234,179,8,0.15); color: var(--yellow); }
.detail-level.l4 { background: rgba(249,115,22,0.15); color: var(--orange); }
.detail-level.l5 { background: rgba(239,68,68,0.15); color: var(--red); }
.detail-title { 
  font-size: 22px; 
  font-weight: 700; 
  line-height: 1.4; 
  margin-bottom: 16px;
}
.detail-section { 
  margin-bottom: 20px; 
}
.detail-section h3 { 
  font-size: 13px; 
  color: var(--text3); 
  text-transform: uppercase; 
  letter-spacing: 0.5px; 
  margin-bottom: 8px; 
}
.detail-content { 
  font-size: 14px; 
  line-height: 1.8; 
  color: var(--text2); 
  background: var(--bg3); 
  padding: 14px; 
  border-radius: var(--radius); 
  white-space: pre-wrap; 
  word-wrap: break-word;
}
.breadcrumb { 
  font-size: 12px; 
  color: var(--text3); 
  margin-bottom: 8px; 
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  font-size: 14px;
}

.spinner {
  border: 2px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="header">
      <h1>📚 Knowledge Tree</h1>
      <div class="stats" id="stats">
        <span><span class="spinner"></span>Loading parts...</span>
      </div>
    </div>
    <div class="tree-container" id="tree"></div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-empty">Select a node to view details</div>
  </div>
</div>

<script>
let treeData = null;
let activeNode = null;
let allNodes = [];

// Load all Part files and merge them
async function loadAllParts() {
  try {
    const partFiles = [];
    // Load parts 1 through 11
    for (let i = 1; i <= 11; i++) {
      const filename = `Part_${i}_tree_enhanced.json`;
      partFiles.push(
        fetch(`../data/tree_parts_enhanced/${filename}`)
          .then(res => {
            if (!res.ok) throw new Error(`Failed to load ${filename}`);
            return res.json();
          })
          .catch(err => {
            console.error(`Error loading ${filename}:`, err);
            return null;
          })
      );
    }

    const parts = await Promise.all(partFiles);
    const validParts = parts.filter(p => p !== null);
    
    // Merge all parts into a single tree
    const mergedTree = {
      title: "Knowledge Tree",
      level: 0,
      children: validParts
    };

    return mergedTree;
  } catch (error) {
    console.error('Error loading parts:', error);
    throw error;
  }
}

async function load() {
  try {
    treeData = await loadAllParts();
    allNodes = [];
    flattenNodes(treeData, []);
    renderStats();
    renderTree(treeData.children, document.getElementById('tree'), 0);
  } catch (error) {
    console.error('Fatal error:', error);
    document.getElementById('stats').innerHTML = '<span style="color: var(--red);">Error loading data</span>';
  }
}

function flattenNodes(node, path) {
  const currentPath = [...path, node.title];
  allNodes.push({ node, path: currentPath });
  if (node.children) {
    for (const child of node.children) {
      flattenNodes(child, currentPath);
    }
  }
}

function renderStats() {
  const total = allNodes.length;
  document.getElementById('stats').innerHTML = `
    <span>Total Nodes: <strong>${total}</strong></span>
    <span>Parts: <strong>11</strong></span>
  `;
}

function renderTree(children, container, depth) {
  if (!children || !Array.isArray(children)) return;
  
  for (const node of children) {
    const hasChildren = node.children && node.children.length > 0;
    const level = node.level || 1;

    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    const row = document.createElement('div');
    row.className = `node-row level-${level}`;
    row.style.paddingLeft = `${12 + depth * 16}px`;

    const toggle = document.createElement('span');
    toggle.className = `toggle ${hasChildren ? '' : 'leaf'}`;
    toggle.textContent = '▶';

    const dot = document.createElement('span');
    dot.className = 'level-dot';

    const title = document.createElement('span');
    title.className = 'node-title';
    title.textContent = node.title;
    title.title = node.title;

    row.appendChild(toggle);
    row.appendChild(dot);
    row.appendChild(title);

    // Build current path
    const currentPath = [node.title];

    // Toggle expand/collapse
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hasChildren) {
        childrenContainer.classList.toggle('open');
        toggle.classList.toggle('open');
      }
      showDetail(node, currentPath);
    });

    // Show detail on node click
    title.addEventListener('click', (e) => {
      e.stopPropagation();
      showDetail(node, currentPath);
    });

    wrapper.appendChild(row);

    // Create children container
    const childrenContainer = document.createElement('div');
    childrenContainer.className = 'children';
    wrapper.appendChild(childrenContainer);

    // Render children recursively
    if (hasChildren) {
      renderTree(node.children, childrenContainer, depth + 1);
    }

    container.appendChild(wrapper);
  }
}

function showDetail(node, path) {
  activeNode = node;
  
  // Update active state
  document.querySelectorAll('.node-row.active').forEach(row => {
    row.classList.remove('active');
  });

  // Find and highlight the clicked row
  const rows = document.querySelectorAll('.node-row');
  for (const row of rows) {
    if (row.querySelector('.node-title').textContent === node.title) {
      row.classList.add('active');
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
  }

  // Build detail panel
  const detailPanel = document.getElementById('detail');
  const level = node.level || 1;
  
  let html = '<div class="detail-header">';
  
  // Breadcrumb
  if (path && path.length > 1) {
    html += `<div class="breadcrumb">${path.join(' > ')}</div>`;
  }
  
  // Level badge
  html += `<div class="detail-level l${level}">Level ${level}</div>`;
  
  // Title
  html += `<div class="detail-title">${node.title}</div>`;
  html += '</div>';

  // Content
  if (node.content) {
    html += `
      <div class="detail-section">
        <h3>Content</h3>
        <div class="detail-content">${escapeHtml(node.content)}</div>
      </div>
    `;
  }

  // Summary
  if (node.summary) {
    html += `
      <div class="detail-section">
        <h3>Summary</h3>
        <div class="detail-content">${escapeHtml(node.summary)}</div>
      </div>
    `;
  }

  // Keywords
  if (node.keywords && node.keywords.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Keywords</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          ${node.keywords.map(kw => `<span style="background: rgba(99,102,241,0.12); color: var(--accent2); padding: 4px 10px; border-radius: 12px; font-size: 12px;">${escapeHtml(kw)}</span>`).join('')}
        </div>
      </div>
    `;
  }

  // Exam points
  if (node.exam_points && node.exam_points.length > 0) {
    html += '<div class="detail-section"><h3>Exam Points</h3>';
    for (const point of node.exam_points) {
      html += `
        <div style="background: var(--bg3); padding: 12px; border-radius: var(--radius); margin-bottom: 8px;">
          <div style="font-size: 14px; margin-bottom: 6px;">${escapeHtml(point.point)}</div>
          <div style="font-size: 12px; color: var(--text3); display: flex; gap: 12px;">
            ${point.type ? `<span>${escapeHtml(point.type)}</span>` : ''}
            ${point.frequency ? `<span>${escapeHtml(point.frequency)}</span>` : ''}
          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  // Children count
  if (node.children && node.children.length > 0) {
    html += `<div class="detail-section"><div style="font-size: 13px; color: var(--text3);">📁 This node has ${node.children.length} child node(s)</div></div>`;
  }

  detailPanel.innerHTML = html;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Initialize
window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
