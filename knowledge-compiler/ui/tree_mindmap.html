          label: {
            position: KT.getLeafLabelPosition(orient),
            verticalAlign: labelVerticalAlign,
            align: labelAlign,
            // 叶子和分支使用同一字号/行高：节点展开/收起时不会从 11px 跳到 12px。
            fontSize: 12,
            lineHeight: 18,
            color: KT.getChartLeafLabelColor(),
            formatter: function(params) {
              const d = params.data;
              if (d._hideLabel) return '';
              const name = KT.wrapLabel(d.name || '', 14, 3);
              if (d.pillKind === 'root') return `{rootPill|${name}}`;
              if (d.pillKind === 'chapter') return `{chapter${(d.pillIndex || 0) % chapterPalette.length}|${name}}`;
              return name;
            },
            rich: Object.assign({
              rootPill: { color: pillText, fontSize: 13, fontWeight: 600, lineHeight: 19 }
            }, chapterRich)
          }
        },
        lineStyle: {
          color: lineColor,
          width: 1.5,
          curveness: 0.5
        },
        emphasis: {
          itemStyle: {
            color: themeAccent,
            borderColor: themeAccent,
            borderWidth: 2,
            shadowBlur: 12,
            shadowColor: themeAccent.replace(')', ', 0.3)').replace('rgb', 'rgba')
          },
          // 悬停只换颜色，不改字号/字重：标签尺寸变化会破坏缩放后的防重叠布局。
          label: {
            color: themeAccent
          }
        },
        edgeShape: 'curve'
      }
    ]
  };

  // Balanced mind-map: split top-level chapters into left/right trees so the
  // document root sits at the visual center, matching Claude's mind-map layout.
  var balancedRendered = false;
  if (isHorizontal && balancedMode && wholeTree && data[0] && (data[0].children || []).length > 1) {
    balancedRendered = true;
    var root = data[0];
    var wing = balancedTreeBoxes(root);
    var leftRoot = Object.assign({}, wing.leftRoot, { _hideLabel: true, pillKind: 'root' });
    // 可见根节点的胶囊左缘必须贴住左右两翼的汇合点；默认 label.distance
    // 会在高倍缩放时留下几像素空隙，让左翼连线看起来没有接到主节点。
    var rightRoot = Object.assign({}, wing.rightRoot, {
      _hideLabel: false, pillKind: 'root',
      label: Object.assign({}, root.label || {}, { distance: 0 })
    });
    var leftBox = wing.leftBox;
    var rightBox = wing.rightBox;
    var leftW = wing.leftW;
    var rightW = wing.rightW;
    lastBoxSize = { w: leftW + rightW, h: wing.maxH };
    var base = option.series[0];
    // 定位点必须朝向父节点：左翼节点文字在点的左侧、右翼文字在点的右侧。
    // 不能沿用整体 layout 的单一 label.position，否则某一翼的点会落在文字外侧。
    var leftLabel = Object.assign({}, base.label, { position: 'left', align: 'right' });
    var rightLabel = Object.assign({}, base.label, { position: 'right', align: 'left' });
    var leftLeaves = Object.assign({}, base.leaves, {
      label: Object.assign({}, base.leaves.label, { position: 'left', align: 'right' })
    });
    var rightLeaves = Object.assign({}, base.leaves, {
      label: Object.assign({}, base.leaves.label, { position: 'right', align: 'left' })
    });
    var leftSeries = Object.assign({}, base, {
      data: [leftRoot], orient: 'RL',
      left: wing.left, top: wing.leftTop,
      width: Math.round(leftW), height: Math.round(wing.maxH),
      label: leftLabel, leaves: leftLeaves
    });
    var rightSeries = Object.assign({}, base, {
      data: [rightRoot], orient: 'LR',
      left: wing.rightLeft, top: wing.rightTop,
      width: Math.round(rightW), height: Math.round(wing.maxH),
      label: rightLabel, leaves: rightLeaves
    });
    option.series = [leftSeries, rightSeries];
  }
  chart.setOption(option, true);
  if (balancedRendered) alignBalancedRoots();
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'kt-mindmap-ready' }, window.location.origin);
    }
  } catch (err) {}

  // 全量重出图（notMerge）会把视图变换重置回 option 的 center/zoom（默认 1），
  // 缩放记账要跟着校正，否则缩放条显示和画面缩放会脱节。
  syncSceneZoomFromView();
  // 等初始/切布局动画完全结束后再做碰撞兜底，避免动画尾帧误判导致二次跳变。
  scheduleLabelSeparation(900);
}

// ── Info Panel ──
function showNodeInfo(d) {
  const panel = document.getElementById('infoPanel');
  const content = document.getElementById('infoContent');
  currentDisplayNode = d;
  let html = `<div class="node-title">${d.name}</div>`;

  if (d.level != null) {
    html += `<span style="font-size:11px;color:var(--ink-muted);">Level ${d.level}</span>`;
  }

  if (d.summary) {
    html += `<div class="field-label">Summary</div>`;
    html += `<div class="summary">${KT.formatSummary(d.summary, d.keywords, 0)}</div>`;
  }

  if (d.highlights && d.highlights.length > 0) {
    html += KT.renderHighlights(d.highlights);
  }

  if (d.keywords && d.keywords.length > 0) {
    html += `<div class="field-label">Keywords</div>`;
    html += `<div class="keywords">`;
    html += d.keywords.map(function(k) {
      if (typeof k === 'object' && k.term) {
        return '<span class="keyword-tag-wrapper"><span class="keyword-tag">' + KT.escapeHtml(k.term) + '</span>'
          + (k.context ? '<span class="keyword-tooltip">' + KT.escapeHtml(k.context) + '</span>' : '')
          + '</span>';
      }
      return '<span class="keyword-tag">' + KT.escapeHtml(k) + '</span>';
    }).join('');
    html += `</div>`;
  }

  if (d.exam_points && d.exam_points.length > 0) {
    html += `<div class="field-label">Exam Points</div>`;
    d.exam_points.forEach(ep => {
      const freqColor = ep.frequency === '高频' ? 'var(--success)' :
                         ep.frequency === '中频' ? 'var(--warning)' : 'var(--ink-muted)';
      html += `<div class="exam-point">
        ${ep.point}
        <div class="exam-meta">
          <span style="color:${freqColor};">${ep.frequency || '-'}</span> &middot; ${ep.type || '-'}
        </div>
      </div>`;
    });
  }

  if (d.captions && d.captions.length > 0) {
    html += `<div class="field-label">Charts &amp; Tables</div>`;
    d.captions.forEach(cap => {
      html += `<div class="caption-item"><b>${cap.label}</b>: ${cap.text}</div>`;
    });
  }

  if (d.content && d.content.length > 0) {
    html += `<div class="field-label">Content <button class="content-edit-btn" id="contentEditBtn" onclick="enterContentEdit()">Edit</button></div>`;
    html += `<div class="content-display" id="contentDisplay">${KT.formatContent(d.content, d.keywords, 0, d.highlights)}</div>`;
    html += `<div class="content-editor-wrap" id="contentEditorWrap">`;
    html += `  <div class="content-edit-bar">`;
    html += `    <button id="fmtBold" onclick="execFmt('bold')" title="Bold (Ctrl+B)"><b>B</b></button>`;
    html += `    <button id="fmtItalic" onclick="execFmt('italic')" title="Italic (Ctrl+I)"><i>I</i></button>`;
    html += `    <button id="fmtStrike" onclick="execFmt('strikethrough')" title="Strikethrough"><s>S</s></button>`;
    html += `  </div>`;
    html += `  <div class="content-editable" id="contentEditable" contenteditable="true"></div>`;
    html += `  <div class="content-actions">`;
    html += `    <button class="btn-save" onclick="saveContentEdit()">Save</button>`;
    html += `    <button class="btn-cancel" onclick="cancelContentEdit()">Cancel</button>`;
    html += `  </div>`;
    html += `</div>`;
  }

  if (d.mermaid) {
    html += KT.renderNodeMermaid(d.mermaid, 'info-mermaid-' + Date.now());
  }

  if (d.tables && d.tables.length > 0) {
    html += KT.renderNodeTables(d.tables);
  }

  if (d.children && d.children.length > 0) {
    html += `<div style="margin-top:10px;font-size:11px;color:var(--ink-muted);">${d.children.length} child node(s)</div>`;
  }

  content.innerHTML = html;
  content.querySelectorAll('img').forEach(function (img) {
    img.classList.add('kt-lightbox-trigger');
    img.addEventListener('click', function (event) {
      event.preventDefault();
      if (KT.openImageLightbox) KT.openImageLightbox(img.currentSrc || img.src, img.alt || d.name || '图片预览');
    });
  });
  if (KT.Panels) KT.Panels.closeOthers('info');
  panel.classList.add('show');
  KT.postRenderMathAndMermaid(content);
}

function closePanel() {
  document.getElementById('infoPanel').classList.remove('show');
  currentDisplayNode = null;
}

// 详情栏展开时，点击画布空白处直接收起。
// 用 zrender 的命中结果区分“节点”和“空白”；同时记录按下位置，
// 避免拖动画布松手时被误判成一次空白点击。
function bindBlankCanvasDismiss() {
  if (!chart || typeof chart.getZr !== 'function') return;
  var zr = chart.getZr();
  if (!zr || zr.__ktBlankDismissBound) return;
  zr.__ktBlankDismissBound = true;
  var press = null;

  function point(e) {
    if (!e) return null;
    var x = e.offsetX != null ? e.offsetX : (e.zrX != null ? e.zrX : (e.event && e.event.offsetX));
    var y = e.offsetY != null ? e.offsetY : (e.zrY != null ? e.zrY : (e.event && e.event.offsetY));
    return x == null || y == null ? null : { x: x, y: y };
  }

  zr.on('mousedown', function (e) {
    var p = point(e);
    press = p ? { x: p.x, y: p.y, hadTarget: !!e.target } : null;
  });
  zr.on('click', function (e) {
    var panel = document.getElementById('infoPanel');
    var p = point(e);
    var moved = !!(press && p && (Math.abs(p.x - press.x) > 4 || Math.abs(p.y - press.y) > 4));
    var blank = !!e && !e.target && !(press && press.hadTarget);
    if (panel && panel.classList.contains('show') && blank && !moved) closePanel();
    press = null;
  });
}

// ── Content Editor ──

function enterContentEdit() {
  if (!currentDisplayNode) return;
  const display = document.getElementById('contentDisplay');
  const editorWrap = document.getElementById('contentEditorWrap');
  const editable = document.getElementById('contentEditable');
  const btn = document.getElementById('contentEditBtn');

  const raw = KT.stripLocalImageRefs(currentDisplayNode.content || '');
  editable.innerHTML = KT.markdownToHtml(KT.escapeHtml(raw)).replace(/\n/g, '<br>');

  display.classList.add('hidden');
  editorWrap.classList.add('active');
  btn.style.display = 'none';
  editable.focus();
}

function cancelContentEdit() {
  const display = document.getElementById('contentDisplay');
  const editorWrap = document.getElementById('contentEditorWrap');
  const btn = document.getElementById('contentEditBtn');

  editorWrap.classList.remove('active');
  display.classList.remove('hidden');
  btn.style.display = '';
}

async function saveContentEdit() {
  if (!currentDisplayNode) return;
  const editable = document.getElementById('contentEditable');
  const newText = KT.htmlToMarkdown(editable.innerHTML).trim();

  currentDisplayNode.content = newText;

  const sourceFile = currentDisplayNode._sourceFile || '';
  if (sourceFile) {
    try {
      const resp = await fetch(`${API_BASE}/api/update-node`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: sourceFile,
          path: currentDisplayNode._pathInFile || [],
          title: currentDisplayNode.name || currentDisplayNode.title,
          content: newText
        })
      });
      if (!resp.ok) {
        const err = await resp.json();
        console.warn('Content save failed:', err.error || resp.status);
      }
    } catch (e) {
      console.warn('Content save failed:', e.message);
    }
  }

  const display = document.getElementById('contentDisplay');
  display.innerHTML = KT.formatContent(newText, currentDisplayNode.keywords || [], 0);
  KT.postRenderMathAndMermaid(display);
  cancelContentEdit();
}

function execFmt(command) {
  document.execCommand(command, false, null);
  document.getElementById('contentEditable').focus();
}

function fitView() {
  if (!chart) return;
  withChartFade(function () {
    chart.setOption({}, { replaceMerge: ['series'] });
    renderChart(currentLayout, currentExpandLevel, currentTargetPath, true);
    // 适应窗口 = 场景缩放把整幅导图缩进视口（不是缩位图），缩放本身带缓动
    var cw = chart.getWidth ? chart.getWidth() : 1000;
    var ch = chart.getHeight ? chart.getHeight() : 700;
    sceneZoom = 1;
    animateSceneZoomTo(Math.min(cw / lastBoxSize.w, ch / lastBoxSize.h) * 0.72);

// ── Search ──

function toggleSearch() {
  var opening = !searchExpanded;
  if (opening && KT.Panels) KT.Panels.closeOthers('search');
  searchExpanded = !searchExpanded;
  var panel = document.getElementById('searchPanel');
  var toggleBtn = document.getElementById('searchToggleBtn');

  if (searchExpanded) {
    panel.classList.remove('collapsed');
    toggleBtn.classList.add('shifted');
    document.getElementById('searchInput').focus();
  } else {
    panel.classList.add('collapsed');
    toggleBtn.classList.remove('shifted');
  }
}

function performSearch() {
  var input = document.getElementById('searchInput');
  var query = input.value.trim();
  var clearBtn = document.getElementById('searchClearBtn');
  var resultsEl = document.getElementById('searchResults');
  var statusEl = document.getElementById('searchStatus');

  if (!query) {
    clearBtn.style.display = 'none';
    resultsEl.innerHTML = '<div class="search-empty">Type to search node titles...</div>';
    statusEl.textContent = '';
    return;
  }

  clearBtn.style.display = 'inline-block';

  if (!allNodes || allNodes.length === 0) {
    resultsEl.innerHTML = '<div class="search-empty">No tree data loaded</div>';
    statusEl.textContent = '';
    return;
  }

  var matches = KT.searchNodes(allNodes, query);

  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="search-empty">No matching nodes found</div>';
    statusEl.textContent = '';
    return;
  }

  statusEl.textContent = matches.length + ' node(s) found';

  var html = '';
  for (var m = 0; m < matches.length; m++) {
    var match = matches[m];
    var pathHtml = '';
    for (var p = 0; p < match.path.length; p++) {
      if (p > 0) pathHtml += '<span class="path-sep">&#9654;</span>';
      pathHtml += KT.escapeHtml(match.path[p] || '');
    }

    var title = match.node.title || match.node.name || '';
    var titleHtml = KT.highlightSearchMatch(title, query);

    html += '<div class="search-result-item" data-node-index="' + match.index + '" onclick="expandToNode(' + match.index + ')">';
    html += '<div class="search-result-path">' + pathHtml + '</div>';
    html += '<div class="search-result-title">' + titleHtml + '</div>';
    html += '</div>';
  }

  resultsEl.innerHTML = html;
}

function expandToNode(nodeIndex) {
  if (!chart || !treeData || nodeIndex >= allNodes.length) return;

  // allNodes 的路径含根节点名（flattenNodes 从 treeData 自身开始），
  // 而 findNodeByPath / 面包屑 / 章节深链都不含根——先归一化，
  // 否则聚焦失败会退化成整树重绘（目标节点被淹没在大树里，视口也无从定位）。
  var targetPath = (allNodes[nodeIndex].path || []).slice();
  var rootName = treeData.title || treeData.name;
  while (targetPath.length && targetPath[0] === rootName) targetPath.shift();
  if (!targetPath.length) targetPath = null;   // 命中的就是根节点本身

  var items = document.querySelectorAll('.search-result-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('active');
  }
  var activeItem = document.querySelector('.search-result-item[data-node-index="' + nodeIndex + '"]');
  if (activeItem) activeItem.classList.add('active');

  // 与章节下钻共用一套聚焦状态：面包屑 / 章节列表跟随更新
  var focusable = !!(targetPath && findNodeByPath(targetPath));
  viewState.focusPath = targetPath || [];
  updateBreadcrumb();
  renderChapterList();

  withChartFade(function () {
    renderChart(currentLayout, -1, targetPath);
    if (focusable) centerViewOnRenderedNode();   // 视口平滑定位到该节点
  });
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '<div class="search-empty">Type to search node titles...</div>';
  document.getElementById('searchStatus').textContent = '';
  if (chart && treeData) {
    // 搜索曾把上下文切到子树（focusPath/ breadcrumb）——清空时显式回到全树
    viewState.focusPath = [];
    updateBreadcrumb();
    renderChapterList();
    renderChart(currentLayout, currentExpandLevel, null);
  }
}

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    if (treeData) {
      e.preventDefault();
      if (!searchExpanded) toggleSearch();
      document.getElementById('searchInput').focus();
      document.getElementById('searchInput').select();
    }
  }
  if (e.key === 'Escape') {
    closeAllMenus();
    if (document.getElementById('infoPanel').classList.contains('show')) {
      closePanel();
    } else if (chapterNavOpen) {
      toggleChapterNav();
    } else if (searchExpanded) {
      toggleSearch();
    }
  }
});

// ── 鼠标交互：滚轮 = 导图上下滚动；Ctrl/⌘+滚轮 = 缩放；左键空白处 / 中键任意处拖动 = 平移 ──
// （echarts roam 默认把滚轮绑成缩放，这里在捕获阶段拦掉，按需求重新映射；
//   平移/缩放都走 treeRoam 动作的 {dx,dy} / {zoom,originX,originY} 像素契约）
//
// 双翼布局由两个 tree series 组成，原生 roam 只会移动被命中的那一侧，导致左右两半
// 在拖动/缩放后分离。这里关闭 series.roam，左键平移统一走 panScene，同时作用于两翼。
// 另：平移/缩放只 dispatch treeRoam 是画面上看不到的（update:'none' 不触发重绘），
// 必须同时直接改视图 group —— 见 panScene / zoomSceneAt。
function treeContentRect() {
  var contexts = getTreeViewContexts();
  if (!contexts.length) return null;
  try {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    contexts.forEach(function (ctx) {
      var group = ctx.group;
      group.updateTransform();
      var r = group.getBoundingRect();
      var t = group.transform || [1, 0, 0, 1, 0, 0];
      var x = t[0] * r.x + t[2] * r.y + t[4];
      var y = t[1] * r.x + t[3] * r.y + t[5];
      var w = Math.abs(t[0]) * r.width + Math.abs(t[2]) * r.height;
      var h = Math.abs(t[1]) * r.width + Math.abs(t[3]) * r.height;
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
  } catch (err) {
    return null;
  }
}

// 取树系列的内部视图上下文。自定义平移/缩放必须直接作用于渲染用的视图 group：
// treeRoam 动作（update:'none'）只把位移/缩放写进 option.center/zoom 和坐标系统，
// 不会触发重绘——只 dispatch 不动 group 的话画面根本不会动，要等下一次重出图才"跳"过去。
function getTreeViewContexts() {
  if (!chart || typeof chart.getModel !== 'function') return [];
  try {
    var ecModel = chart.getModel();
    var list = typeof ecModel.getSeries === 'function'
      ? ecModel.getSeries()
      : [];
    if (!list.length && typeof ecModel.getSeriesByIndex === 'function') {
      var seen = {};
      for (var n = 0; n < 32; n++) {
        var next = ecModel.getSeriesByIndex(n);
        if (!next) break;
        var key = next.id || ('series-' + n);
        if (seen[key]) break;
        seen[key] = true;
        list.push(next);
      }
    }
    var contexts = [];
    list.forEach(function (seriesModel) {
      // 兼容只提供 series 模型的测试桩；真实 ECharts 的 tree series 带有 subType。
      if (!seriesModel || (seriesModel.subType && seriesModel.subType !== 'tree')) return;
      var view = typeof chart.getViewOfSeriesModel === 'function'
        ? chart.getViewOfSeriesModel(seriesModel)
        : null;
      if (!view && chart._chartsViews) {   // 兜底：视图组从内部视图表里找
        for (var i = 0; i < chart._chartsViews.length; i++) {
          if (chart._chartsViews[i] && chart._chartsViews[i].__model === seriesModel) {
            view = chart._chartsViews[i];
            break;
          }
        }
      }
      if (view && view.group) contexts.push({ seriesModel: seriesModel, view: view, group: view.group });
    });
    return contexts;
  } catch (err) {
    return [];
  }
}

function getTreeViewContext() {
  var contexts = getTreeViewContexts();
  return contexts.length ? contexts[0] : null;
}

// 平移视图：先动 group（立即可见，与 echarts 原生 roam 同路径），再 dispatch 记账
// （option.center 更新后，重出图/展开收起时视角不会丢）。
function panScene(dx, dy) {
  if ((!dx && !dy) || !chart) return;
  cancelLabelSeparation();
  var contexts = getTreeViewContexts();
  if (contexts.length) {
    contexts.forEach(function (ctx) {
      cancelGroupYTween(ctx.group);
      ctx.group.x += dx;
      ctx.group.y += dy;
      ctx.group.dirty();
      chart.dispatchAction({ type: 'treeRoam', seriesId: ctx.seriesModel.id, dx: dx, dy: dy });
    });
  } else {
    chart.dispatchAction({ type: 'treeRoam', seriesIndex: 0, dx: dx, dy: dy });
  }
}

// 围绕 (originX, originY) 缩放视图。公式与 echarts 原生 roam 的 updateViewOnZoom 一致：
// 先按 origin 平移补偿，再缩放 group；节点符号的跟随缩放交给视图自身的 _updateNodeAndLinkScale。
function zoomSceneAt(delta, originX, originY) {
  if (!chart || !delta || Math.abs(delta - 1) < 1e-4) return;
  cancelLabelSeparation();
  var contexts = getTreeViewContexts();
  if (contexts.length) {
    contexts.forEach(function (ctx) {
      var g = ctx.group;
      cancelGroupYTween(g);
      g.x -= (originX - g.x) * (delta - 1);
      g.y -= (originY - g.y) * (delta - 1);
      g.scaleX *= delta;
      g.scaleY *= delta;
      g.dirty();
      chart.dispatchAction({
        type: 'treeRoam', seriesId: ctx.seriesModel.id, zoom: delta,
        originX: originX, originY: originY
      });
      if (typeof ctx.view._updateNodeAndLinkScale === 'function') {
        try { ctx.view._updateNodeAndLinkScale(ctx.seriesModel); } catch (err) {}
      }
    });
  } else {
    chart.dispatchAction({
      type: 'treeRoam', seriesIndex: 0, zoom: delta,
      originX: originX, originY: originY
    });
  }
  scheduleLabelScale(contexts.length ? currentViewScale() : (sceneZoom || 1) * delta);
}

// ── 动效层：GSAP 可用时给视角切换 / 滚轮 / 缩放加缓动；否则退回即时行为 ──
// （CDN 加载失败、jsdom 测试、系统「减弱动态效果」→ 一律走原有无动画路径）
function prefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (err) { return false; }
}
function hasGsap() { return typeof window.gsap !== 'undefined' && !prefersReducedMotion(); }

// 视角切换（适应窗口 / 回到中心 / 搜索下钻 / 章节下钻）：快速淡出 → 重绘 → 淡入，
// 遮住 notMerge 重绘造成的瞬时跳变。
var viewSwapReady = false;   // 首次渲染完成前不做淡入淡出
var _viewSwapTl = null;
function withChartFade(swap) {
  var el = document.getElementById('chart');
  if (!el || !hasGsap() || !viewSwapReady) { swap(); return; }
  if (_viewSwapTl) _viewSwapTl.kill();
  _viewSwapTl = gsap.timeline()
    .to(el, { autoAlpha: 0, duration: 0.09, ease: 'power1.in' })
    .add(function () { swap(); })
    .fromTo(el, { autoAlpha: 0, y: 6 },
      { autoAlpha: 1, y: 0, duration: 0.22, ease: 'power2.out', clearProps: 'opacity,visibility,transform' });
}

// 平移平滑：目标位移累积，gsap.ticker 逐帧指数收敛（滚轮滚动 / 搜索定位共用）
// onDone：位移全部消化后的回调（搜索定位用它做"到位脉冲"）
var _wheelDx = 0, _wheelDy = 0, _wheelTick = false, _smoothPanDone = null;
function smoothPanBy(dx, dy, onDone) {
  if (onDone) _smoothPanDone = onDone;
  if (!hasGsap()) { panScene(dx, dy); _drainPanDone(); return; }
  _wheelDx += dx; _wheelDy += dy;
  if (!_wheelTick) { _wheelTick = true; gsap.ticker.add(_onWheelTick); }
}
function _drainPanDone() {
  if (_smoothPanDone) { var d = _smoothPanDone; _smoothPanDone = null; d(); }
}
function _onWheelTick() {
  if (!_wheelDx && !_wheelDy) { gsap.ticker.remove(_onWheelTick); _wheelTick = false; _drainPanDone(); return; }
  var dx = _wheelDx * 0.22, dy = _wheelDy * 0.22;
  _wheelDx -= dx; _wheelDy -= dy;
  if (Math.abs(_wheelDx) < 0.4) { dx += _wheelDx; _wheelDx = 0; }
  if (Math.abs(_wheelDy) < 0.4) { dy += _wheelDy; _wheelDy = 0; }
  panScene(dx, dy);
}

// 缩放平滑：朝目标缩放逐帧收敛（缩放条 / Ctrl+滚轮 / 适应窗口共用）
var _zoomTarget = null, _zoomOriginX = null, _zoomOriginY = null, _zoomTick = false;
function animateSceneZoomTo(target, originX, originY) {
  target = Math.min(3, Math.max(0.05, target));
  if (!hasGsap()) { applySceneZoom(target, originX, originY); return; }
  _zoomTarget = target;
  _zoomOriginX = originX != null ? originX : null;
  _zoomOriginY = originY != null ? originY : null;
  if (!_zoomTick) { _zoomTick = true; gsap.ticker.add(_onZoomTick); }
}
function nudgeZoom(factor, originX, originY) {
  animateSceneZoomTo((_zoomTarget != null ? _zoomTarget : sceneZoom) * factor, originX, originY);
}
function _onZoomTick() {
  if (_zoomTarget == null) { gsap.ticker.remove(_onZoomTick); _zoomTick = false; return; }
  var diff = _zoomTarget - sceneZoom;
  if (Math.abs(diff) < 0.002) {
    applySceneZoom(_zoomTarget, _zoomOriginX, _zoomOriginY);
    _zoomTarget = null;
    gsap.ticker.remove(_onZoomTick); _zoomTick = false;
    return;
  }
  applySceneZoom(sceneZoom + diff * 0.18, _zoomOriginX, _zoomOriginY);
}

// 把视口平滑对到「聚焦子树的根节点」上（搜索定位用）。
// 位置由节点布局坐标 + 两级容器变换解析求出（不吃入场动画中的元素中间态）。
function centerViewOnRenderedNode() {
  var ctx = getTreeViewContext();
  if (!ctx) return;
  try {
    var data = ctx.seriesModel.getData();
    var vRoot = data.tree && data.tree.root;
    var node = vRoot && vRoot.children && vRoot.children[0];   // 聚焦树的真实根节点
    var ly = node && node.getLayout && node.getLayout();
    if (!ly || ly.x == null || ly.y == null) return;
    var g = ctx.group, mg = ctx.view && ctx.view._mainGroup;
    if (g && g.updateTransform) g.updateTransform();
    if (mg && mg.updateTransform) mg.updateTransform();
    // zrender 的 transform 在 updateTransform 后已乘进父链（组合到根），
    // 直接用 mainGroup 的组合矩阵，不要再叠加 group——否则平移/缩放过的视图会算错。
    var m = (mg && mg.transform) || (g && g.transform) || [1, 0, 0, 1, 0, 0];
    var px = m[0] * ly.x + m[2] * ly.y + m[4];
    var py = m[1] * ly.x + m[3] * ly.y + m[5];
    var cw = chart.getWidth ? chart.getWidth() : 1000;
    var ch = chart.getHeight ? chart.getHeight() : 700;
    smoothPanBy(cw / 2 - px, ch / 2 - py, function () {
      // 到达中心后再补一个脉冲，确认"就是这个节点"（减动效时自动跳过）
      pulseNodeAt({ offsetX: cw / 2, offsetY: ch / 2 });
    });
  } catch (err) {}
}

// 节点点击脉冲反馈（DOM 涟漪，不动 echarts 场景；reduced-motion 跳过）
function pulseNodeAt(ev) {
  if (prefersReducedMotion()) return;
  var host = document.getElementById('chartContainer');
  if (!host || !ev) return;
  var old = host.querySelector('.node-pulse');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var dot = document.createElement('i');
  dot.className = 'node-pulse';
  var rect = host.getBoundingClientRect();
  var x = ev.offsetX != null ? ev.offsetX : (ev.clientX - rect.left);
  var y = ev.offsetY != null ? ev.offsetY : (ev.clientY - rect.top);
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  host.appendChild(dot);
  var cleanup = function () { if (dot.parentNode) dot.parentNode.removeChild(dot); };
  dot.addEventListener('animationend', cleanup);
  setTimeout(cleanup, 1000);   // 兜底：动画事件缺失时也能清理
}

function setupMapMouseBindings() {
  var area = document.getElementById('chartContainer');
  if (!area) return;
  if (area.__ktMouseBound) return;   // 幂等：避免重复 initChart 时反复叠加监听
  area.__ktMouseBound = true;

  function normDelta(e) {
    var d = e.deltaY;
    if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 100;
    return d;
  }

  area.addEventListener('wheel', function (e) {
    if (!chart) return;
    e.preventDefault();
    e.stopPropagation();   // 拦掉 echarts 默认的滚轮缩放
    if (e.ctrlKey || e.metaKey) {
      var rect = area.getBoundingClientRect();
      // 场景缩放（跟随鼠标点，带收敛缓动），记账 sceneZoom
      nudgeZoom(Math.pow(1.0018, -normDelta(e)),
        e.clientX - rect.left, e.clientY - rect.top);
    } else {
      smoothPanBy(0, -normDelta(e));
    }
  }, { passive: false, capture: true });

  // 原生 tree roam 已关闭（双翼布局下它只会拖动命中的单个 series）。
  // 左键拖动统一由 panScene 接管，从而左右两翼始终作为一个整体移动。
  function leftDragNeedsTakeover(e) {
    return !(e.target && e.target.closest && e.target.closest('button, input, textarea, select'));
  }

  var dragging = false, lastX = 0, lastY = 0;
  area.addEventListener('mousedown', function (e) {
    if (!chart) return;
    if (e.button === 1) {
      e.preventDefault();   // 避免浏览器中键自动滚动
    } else if (e.button === 0) {
      if (!leftDragNeedsTakeover(e)) return;
    } else {
      return;
    }
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging || !chart) return;
    panScene(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', function (e) {
    if (e.button === 0 || e.button === 1) dragging = false;
  });
}

// ── 场景缩放（真缩放：缩的是导图场景，不是画布位图）──
// 旧实现是 CSS scale 缩画布位图：全展开后超出画布的内容根本没画出来，
// 缩小只会露出"截断"的位图边缘。现改为 treeRoam 场景缩放（按视口中心/鼠标点缩放），
// 缩小能把画布外的内容拉进视口。sceneZoom 是与 roam 同步的缩放记账。
var sceneZoom = 1;

function syncZoomUI() {
  var label = document.getElementById('zoomLabel');
  var range = document.getElementById('zoomRange');
  var pct = Math.round(sceneZoom * 100);
  if (label) label.textContent = pct + '%';
  if (range) range.value = pct;
}

// 以视图 group 的真实缩放为准校正 sceneZoom 记账（重出图后调用）。
function syncSceneZoomFromView() {
  var ctx = getTreeViewContext();
  if (!ctx) return;
  var s = ctx.group.scaleX || 1;
  sceneZoom = Math.min(3, Math.max(0.05, s));
  syncZoomUI();
}

function applySceneZoom(target, originX, originY) {
  if (!chart) return;
  target = Math.min(3, Math.max(0.05, target));
  var delta = target / sceneZoom;
  if (Math.abs(delta - 1) < 1e-4) return;
  var cx = (chart.getWidth ? chart.getWidth() : 1000) / 2;
  var cy = (chart.getHeight ? chart.getHeight() : 700) / 2;
  zoomSceneAt(delta, originX != null ? originX : cx, originY != null ? originY : cy);
  sceneZoom = target;
  syncZoomUI();
}

function zoomBy(deltaPct) {
  var box = document.getElementById('chartContainer');
  var rect = box ? box.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  var target = Math.max(0.05, Math.min(3, sceneZoom + Number(deltaPct || 0) / 100));
  animateSceneZoomTo(target, rect.left + rect.width / 2, rect.top + rect.height / 2);
}

function updateZoom(zoom) {
  animateSceneZoomTo(zoom);
}
document.getElementById('zoomRange').addEventListener('input', function(e) {
  updateZoom(parseInt(e.target.value) / 100);
});

window.addEventListener('message', function (event) {
  if (event.origin !== location.origin || !event.data) return;
  if (event.data.type === 'kt-resize' && chart) {
    chart.resize();
    if (typeof centerView === 'function') centerView();
  }
});

window.addEventListener('DOMContentLoaded', initChart);
</script>
</body>
