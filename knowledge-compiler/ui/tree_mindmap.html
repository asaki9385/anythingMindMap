<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="embed-mode.js?v=1"></script>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingMindmap - Mind Map</title>
<link rel="stylesheet" href="vendor/mind-elixir/MindElixir.css">
<link rel="stylesheet" href="vendor/mind-elixir/Outliner.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="cds-theme.css?v=4">
<link rel="stylesheet" href="theme.css?v=4">
<link rel="stylesheet" href="client-embed.css?v=2">
<link rel="stylesheet" href="knowledge_map.css?v=3">
<style>
  /* page-local menu chrome + embed presentation; everything else lives in knowledge_map.css */
  .ktm-menu { position: relative; }
  .ktm-menu > summary { list-style: none; }
  .ktm-menu > summary::-webkit-details-marker { display: none; }
  .ktm-menu[open] > summary { background: var(--ktm-fill-selected); color: var(--ink); }
  .ktm-menu[open] > summary svg { color: var(--accent); }

  .ktm-menu-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 60;
    width: max-content;
    min-width: 232px;
    max-width: min(360px, calc(100vw - 24px));
    padding: 6px;
    border: 0;
    border-radius: var(--ktm-pop-radius);
    background: var(--ktm-pop-bg);
    box-shadow: var(--ktm-pop-shadow);
    transform-origin: top right;
    animation: ktmPopIn 200ms cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes ktmPopIn {
    from { opacity: 0; transform: scale(.95) translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .ktm-menu-panel { animation: none; } }

  .ktm-menu-label { padding: 6px 10px 4px; font-size: 10.5px; color: var(--ink-muted); letter-spacing: .06em; }

  .ktm-menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    height: 32px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-secondary);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 0 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 150ms var(--ktm-ease-swift), color 150ms var(--ktm-ease-swift);
  }
  .ktm-menu-item:hover { background: var(--ktm-fill-hover); color: var(--ink); }
  .ktm-menu-item.is-active { color: var(--accent); background: var(--ktm-fill-selected); }
  .ktm-menu-item > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ktm-menu-item .k { margin-left: auto; flex: none; font-size: 11px; color: var(--ink-muted); white-space: nowrap; }

  .ktm-menu-sep { height: 1px; margin: 4px 6px; background: var(--border); }

  .ktm-menu-select {
    flex: 1 1 auto;
    min-width: 104px;
    width: auto;
    height: 28px;
    border: 0;
    border-radius: 7px;
    background: var(--ktm-fill-secondary);
    color: var(--ink-secondary);
    font: inherit;
    font-size: 12px;
    padding: 0 8px;
    box-shadow: var(--ktm-field-shadow);
  }
  .ktm-menu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .ktm-menu-row > span { flex: 0 0 auto; white-space: nowrap; }

  /* ── embed: no page header; canvas actions become a floating island ── */
  html[data-embed="1"] .ktm-header { height: 0; background: none; border: 0; overflow: visible; }
  html[data-embed="1"] .ktm-brandbar { display: none; }
  html[data-embed="1"] .ktm-toolrow { padding: 0; }
  html[data-embed="1"] .ktm-stats { display: none; }
  html[data-embed="1"] .ktm-toolbar {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 60;
    flex-wrap: nowrap;
    gap: 2px;
    padding: 4px 6px;
    border-radius: 16px;
    background: var(--ktm-pop-bg);
    box-shadow: var(--ktm-pop-shadow);
  }
  html[data-embed="1"] .ktm-toolsep { margin: 0 4px; }
  html[data-embed="1"] #btnDrawer,
  html[data-embed="1"] #btnReview,
  html[data-embed="1"] #btnOverview { display: none !important; }
  html[data-embed="1"] .ktm-menu-panel {
    top: auto;
    bottom: calc(100% + 8px);
    transform-origin: bottom right;
  }
  @media (max-width: 760px) {
    html[data-embed="1"] .ktm-toolbar {
      left: 8px;
      right: 8px;
      transform: none;
      justify-content: center;
      flex-wrap: wrap;
      row-gap: 2px;
    }
    html[data-embed="1"] .ktm-zoom input[type="range"] { width: 64px; }
    html[data-embed="1"] body:has(.ktm-info-panel.show) .ktm-toolbar {
      right: calc(8px + var(--ktm-panel-w));
    }
  }
  /* Very narrow canvases: let the island become two rows instead of clipping. */
  @media (max-width: 520px) {
    html[data-embed="1"] .ktm-toolbar { flex-wrap: wrap; row-gap: 2px; }
    html[data-embed="1"] .ktm-menu-panel {
      position: fixed;
      left: 8px;
      right: 8px;
      top: auto;
      bottom: 76px;
      width: auto;
      max-width: none;
    }
  }
</style>
</head>
<body>
<div class="ktm-page">
  <header class="ktm-header">
    <div class="ktm-brandbar">
      <a href="/ui/client.html#home" class="ktm-brand" title="返回首页"><span data-icon="tree"></span><span>AnythingMindmap</span></a>
      <span class="ktm-brand-sep" aria-hidden="true"></span>
      <div class="ktm-title-wrap">
        <h1 class="ktm-title" id="docTitle">思维导图</h1>
      </div>
      <div class="ktm-brand-actions">
        <a href="/ui/settings.html" class="ktm-link-btn" title="统一设置（模型服务 / MinerU / 学科）"><span data-icon="settings"></span> 设置</a>
        <button type="button" class="ktm-link-btn" id="themeToggle" onclick="toggleTheme()"><span data-icon="sun" id="themeIcon"></span><span id="themeLabel">深色</span></button>
      </div>
    </div>
    <div class="ktm-toolrow">
      <div class="ktm-toolbar ktm-controls" id="ktmToolbar" role="toolbar" aria-label="导图工具">
        <div class="ktm-toolgroup">
          <button type="button" class="ktm-btn" id="btnDrawer" title="章节 / 大纲（可折叠）"><span data-icon="list"></span> 章节</button>
          <button type="button" class="ktm-btn" id="btnSearch" title="搜索节点（Ctrl+F）"><span data-icon="search"></span> 搜索</button>
        </div>
        <span class="ktm-toolsep" aria-hidden="true"></span>
        <div class="ktm-toolgroup">
          <div class="ktm-zoom">
            <button type="button" class="ktm-icon-btn" id="zoomOutBtn" aria-label="缩小">−</button>
            <input type="range" id="zoomRange" min="5" max="250" value="100" step="5" aria-label="缩放">
            <button type="button" class="ktm-icon-btn" id="zoomInBtn" aria-label="放大">+</button>
            <span class="ktm-zoom-label" id="zoomLabel">100%</span>
          </div>
        </div>
        <span class="ktm-toolsep" aria-hidden="true"></span>
        <div class="ktm-toolgroup">
          <details class="ktm-menu" id="viewMenu">
            <summary><span data-icon="eye"></span> 视图 <span data-icon="chevronDown"></span></summary>
            <div class="ktm-menu-panel">
              <div class="ktm-menu-label">排列与展开</div>
              <div class="ktm-menu-row"><span>排列方向</span>
                <select class="ktm-menu-select" id="layoutSelect" aria-label="排列方向">
                  <option value="SIDE" selected>左右平衡</option>
                  <option value="RIGHT">全部向右</option>
                  <option value="LEFT">全部向左</option>
                  <option value="DOWN">向下</option>
                </select>
              </div>
              <div class="ktm-menu-row"><span>展开层级</span>
                <select class="ktm-menu-select" id="expandLevel" aria-label="展开层级">
                  <option value="1">1</option><option value="2" selected>2</option>
                  <option value="3">3</option><option value="4">4</option>
                  <option value="5">5</option><option value="6">6</option>
                </select>
              </div>
              <div class="ktm-menu-sep"></div>
              <button type="button" class="ktm-menu-item" data-ktm-view="fit"><span>适应窗口</span><span class="k">F</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-view="expand-all"><span>全部展开</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-view="collapse-all"><span>全部收起</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-view="minimap" aria-pressed="false"><span>小地图</span><span class="k">M</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-view="help"><span>快捷键</span><span class="k">?</span></button>
            </div>
          </details>
          <details class="ktm-menu" id="exportMenu">
            <summary><span data-icon="export"></span> 导出 <span data-icon="chevronDown"></span></summary>
            <div class="ktm-menu-panel">
              <div class="ktm-menu-label">导出与打印</div>
              <button type="button" class="ktm-menu-item" data-ktm-export="png"><span>导出 PNG（整图）</span></button>
              <div class="ktm-menu-sep"></div>
              <button type="button" class="ktm-menu-item" data-ktm-export="handout-current"><span>打印讲义</span><span class="k">所选分支</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-export="handout-all"><span>打印讲义</span><span class="k">全书</span></button>
              <div class="ktm-menu-sep"></div>
              <button type="button" class="ktm-menu-item" data-ktm-export="outline"><span>导出大纲 Markdown</span></button>
              <button type="button" class="ktm-menu-item" data-ktm-export="anki"><span>导出复习卡 CSV</span><span class="k">Anki 可导入</span></button>
              <div class="ktm-menu-sep"></div>
              <button type="button" class="ktm-menu-item" data-ktm-export="package"><span>导出数据包 ZIP</span><span class="k">可重新导入</span></button>
            </div>
          </details>
        </div>
        <span class="ktm-toolsep" aria-hidden="true"></span>
        <div class="ktm-toolgroup">
          <button type="button" class="ktm-btn" id="btnEdit" aria-pressed="false" title="编辑模式：改名 / 改内容 / 增删 / 拖拽 / 撤销"><span data-icon="edit"></span><span class="label">编辑</span></button>
          <span class="ktm-save-status" id="ktmSaveStatus" aria-live="polite"></span>
        </div>
        <span class="ktm-toolsep" aria-hidden="true"></span>
        <div class="ktm-toolgroup">
          <button type="button" class="ktm-btn" id="btnReview" title="对话复习（AI 结合当前章节提问）"><span data-icon="message"></span> 对话复习</button>
          <a class="ktm-link-btn" id="btnOverview" href="/ui/client.html#library" title="返回资料导览"><span data-icon="menu"></span> 资料导览</a>
        </div>
      </div>
      <div class="ktm-stats" id="stats">加载中…</div>
    </div>
  </header>

  <div class="ktm-canvas" id="chartContainer">
    <div class="ktm-loading" id="loading"><span class="spinner"></span><span>正在加载知识树…</span></div>
    <div id="chart" aria-label="知识树画布"></div>
    <div class="ktm-breadcrumb" id="breadcrumb"></div>
    <div class="ktm-canvas-actions">
      <button type="button" class="ktm-btn" id="centerViewBtn" title="视角回到导图中心"><span data-icon="target"></span> 居中</button>
    </div>
    <canvas class="ktm-minimap" id="minimap" width="188" height="124" aria-label="小地图，点击或拖拽可定位画布" title="点击跳转，拖拽平移画布" hidden></canvas>
  </div>
</div>

<div class="ktm-edit-bar" id="ktmEditBar" role="toolbar" aria-label="编辑工具" hidden>
  <button type="button" data-ktm-edit="undo" title="撤销 Ctrl+Z"><span data-icon="undo"></span><span>撤销</span></button>
  <button type="button" data-ktm-edit="redo" title="重做 Ctrl+Shift+Z"><span data-icon="redo"></span><span>重做</span></button>
  <span class="ktm-edit-sep"></span>
  <button type="button" data-ktm-edit="addChild" title="添加子节点 Tab"><span data-icon="plus"></span><span>子节点</span></button>
  <button type="button" data-ktm-edit="addSibling" title="添加同级 Enter"><span data-icon="plus"></span><span>同级</span></button>
  <button type="button" data-ktm-edit="content" title="编辑节点名称、摘要与正文"><span data-icon="pencil"></span><span>内容</span></button>
  <button type="button" data-ktm-edit="delete" class="is-danger" title="删除 Delete"><span data-icon="trash"></span><span>删除</span></button>
  <span class="ktm-edit-sep"></span>
  <button type="button" data-ktm-edit="done"><span data-icon="check"></span><span>完成</span></button>
</div>

<div class="ktm-search" id="searchPanel" role="dialog" aria-modal="true" aria-label="搜索节点" aria-hidden="true">  <div class="ktm-search-head">
    <span data-icon="search"></span>
    <input type="search" id="searchInput" placeholder="搜索标题、摘要、关键词、考点、正文…" autocomplete="off" aria-label="搜索关键词">
    <button type="button" class="ktm-icon-btn" id="searchCloseBtn" aria-label="关闭搜索">×</button>
  </div>
  <div class="ktm-search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
  <div class="ktm-search-status" id="searchStatus"></div>
</div>

<aside class="ktm-drawer" id="chapterSidebar" aria-label="章节与大纲">
  <div class="ktm-drawer-head">
    <span class="ktm-drawer-title">资料结构</span>
    <button type="button" class="ktm-icon-btn" id="chapterCloseBtn" aria-label="收起">×</button>
  </div>
  <div class="ktm-drawer-tabs" role="tablist">
    <button type="button" class="ktm-drawer-tab is-active" data-ktm-drawer-tab="chapters" role="tab" aria-selected="true">章节</button>
    <button type="button" class="ktm-drawer-tab" data-ktm-drawer-tab="outline" role="tab" aria-selected="false">大纲</button>
  </div>
  <div class="ktm-drawer-body" id="chapterList" role="tabpanel"></div>
  <div class="ktm-drawer-body ktm-outline-mount" id="outlineMount" role="tabpanel" hidden></div>
</aside>

<aside class="ktm-info-panel" id="infoPanel" aria-label="节点详情">
  <div class="ktm-info-head">
    <b>节点详情</b>
    <button type="button" class="ktm-info-close" onclick="KTMap.closeDetail()" aria-label="关闭">×</button>
  </div>
  <div class="ktm-info-body" id="infoContent"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="common.js?v=8"></script>
<script src="vendor/mind-elixir/mind-elixir.iife.js"></script>
<script defer src="vendor/export-mindmap/export-mindmap.umd.js"></script>
<script src="map/map_adapter.js?v=3"></script>
<script src="map/knowledge_map.js?v=3"></script>
<script src="map/map_exports.js?v=2"></script>
<script src="review_widget.js?v=30"></script>
<script>
(function () {
  'use strict';

  var API_BASE = location.protocol === 'file:' ? 'http://localhost:8000' : '';
  var params = new URLSearchParams(location.search);
  var OFFLINE = !!window.KT_OFFLINE;
  var EMBED = params.get('embed') === '1';
  var READONLY = OFFLINE || params.get('readonly') === '1';
  var map = null;
  var key = '';
  var rev = '';
  var treeData = null;

  function $(id) { return document.getElementById(id); }
  function setText(id, text) { var el = $(id); if (el) el.textContent = text; }
  function toast(message) { if (KT && KT.showToast) KT.showToast(message); else console.log(message); }

  function syncThemeUI() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    setText('themeLabel', dark ? '浅色' : '深色');
    var icon = $('themeIcon');
    if (icon && KT && KT.iconHtml) icon.innerHTML = KT.iconHtml(dark ? 'sun' : 'moon');
  }
  window.toggleTheme = function () {
    if (KT && KT.toggleTheme) KT.toggleTheme();
    syncThemeUI();
  };

  function fail(message, detail) {
    var loading = $('loading');
    if (loading) loading.hidden = true;
    var chart = $('chart');
    if (chart) {
      chart.innerHTML = '<div class="ktm-fallback"><h2>导图加载失败</h2><p>'
        + KT.escapeHtml(message) + '</p>'
        + (detail ? '<p class="ktm-muted">' + KT.escapeHtml(detail) + '</p>' : '')
        + '<p><a class="ktm-link" href="/ui/client.html#library">返回资料库</a></p></div>';
    }
    setText('stats', '加载失败');
  }

  async function fetchTree() {
    if (OFFLINE) {
      var offlineEl = document.getElementById('kt-offline-tree');
      if (!offlineEl) throw new Error('离线包缺少知识树数据');
      return { tree: JSON.parse(offlineEl.textContent), key: '', rev: '', title: '' };
    }
    var taskId = params.get('task');
    var fileKey = params.get('file');
    if (!taskId && !fileKey) throw new Error('缺少资料参数（?file= 或 ?task=）');
    key = taskId ? ('task_' + taskId) : fileKey;
    var url = API_BASE + '/api/tree/' + encodeURIComponent(key);
    for (var attempt = 0; attempt < 40; attempt++) {
      var res = await fetch(url, { cache: 'no-store' });
      if (res.status === 202) {
        var status = await res.json().catch(function () { return {}; });
        setText('stats', '正在解析… ' + Math.round(Number(status.progress) || 0) + '%');
        await new Promise(function (resolve) { setTimeout(resolve, 1500); });
        continue;
      }
      if (!res.ok) {
        var body = await res.json().catch(function () { return {}; });
        throw new Error(body.error || ('加载失败（' + res.status + '）'));
      }
      var payload = await res.json();
      return { tree: payload.tree, key: key, rev: payload.rev || '', title: payload.title || '' };
    }
    throw new Error('解析超时，请稍后重试');
  }

  function bindHeader() {
    var searchBtn = $('btnSearch');
    if (searchBtn) searchBtn.addEventListener('click', function () { map.toggleSearch(); });
    var drawerBtn = $('btnDrawer');
    if (drawerBtn) drawerBtn.addEventListener('click', function () { map.toggleDrawer(); });
    var editBtn = $('btnEdit');
    if (editBtn) editBtn.addEventListener('click', function () { map.setEditable(!map.isEditing()); });
    var reviewBtn = $('btnReview');
    if (reviewBtn) reviewBtn.addEventListener('click', function () {
      if (window.ReviewWidget && ReviewWidget.open) ReviewWidget.open();
    });
    var zoomRange = $('zoomRange');
    if (zoomRange) zoomRange.addEventListener('input', function () { map.zoomTo(Number(zoomRange.value) / 100); });
    var layout = $('layoutSelect');
    if (layout) layout.addEventListener('change', function () { map.setLayout(layout.value, { force: true }); });
    var expand = $('expandLevel');
    if (expand) expand.addEventListener('change', function () { map.setExpandLevel(Number(expand.value)); });
    document.querySelectorAll('[data-ktm-view]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.getAttribute('data-ktm-view');
        closeMenus();
        if (action === 'fit') map.fit();
        else if (action === 'expand-all') {
          var count = map.getAdapter().count();
          if (count > 800 && !window.confirm('当前有 ' + count + ' 个节点，全部展开可能较慢。继续？')) return;
          map.expandAll();
        } else if (action === 'collapse-all') map.collapseAll();
        else if (action === 'minimap') map.toggleMinimap();
        else if (action === 'help') map.toggleHelp();
      });
    });
    document.querySelectorAll('[data-ktm-export]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.getAttribute('data-ktm-export');
        closeMenus();
        if (action === 'png') KTMapExports.exportPNG();
        else if (action === 'handout-current') KTMapExports.exportModuleHandout();
        else if (action === 'handout-all') KTMapExports.exportWholeHandout();
        else if (action === 'outline') KTMapExports.exportOutlineMarkdown();
        else if (action === 'anki') KTMapExports.exportAnkiCSV();
        else if (action === 'package') KTMapExports.exportDataPackage();
      });
    });
    document.querySelectorAll('[data-ktm-drawer-tab]').forEach(function (tab) {
      tab.addEventListener('click', function () {
        var name = tab.getAttribute('data-ktm-drawer-tab');
        document.querySelectorAll('[data-ktm-drawer-tab]').forEach(function (t) {
          var active = t === tab;
          t.classList.toggle('is-active', active);
          t.setAttribute('aria-selected', String(active));
        });
        var chapters = $('chapterList');
        var outline = $('outlineMount');
        if (chapters) chapters.hidden = name !== 'chapters';
        if (outline) outline.hidden = name !== 'outline';
        if (name === 'outline') map.openOutline(outline);
      });
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest || !e.target.closest('details.ktm-menu')) closeMenus();
    });
  }

  // Separators are static siblings, so a group hidden by embed/readonly rules can
  // leave a dangling rule (or two back-to-back). Hide separators with no visible
  // neighbour after the header is wired and after buttons get hidden at runtime.
  function pruneToolSeparators() {
    var bar = $('ktmToolbar');
    if (!bar) return;
    var kids = Array.prototype.slice.call(bar.children);
    function groupVisible(group) {
      if (!group) return false;
      var items = group.querySelectorAll('button, a, details, select, input');
      for (var i = 0; i < items.length; i++) {
        if (!items[i].hidden && items[i].offsetParent !== null) return true;
      }
      return false;
    }
    kids.forEach(function (el, index) {
      if (!el.classList || !el.classList.contains('ktm-toolsep')) return;
      el.hidden = !(groupVisible(kids[index - 1]) && groupVisible(kids[index + 1]));
    });
  }

  function closeMenus() {
    document.querySelectorAll('details.ktm-menu[open]').forEach(function (d) { d.open = false; });
  }

  function updateStats() {
    var adapter = map.getAdapter();
    var count = adapter.count();
    setText('docTitle', adapter.title || '思维导图');
    setText('docStats', count + ' 个知识点');
    setText('stats', count + ' 个知识点');
    document.title = (adapter.title || '思维导图') + ' · AnythingMindmap';
  }

  function syncHeaderHeight() {
    var header = document.querySelector('.ktm-header');
    if (header) document.documentElement.style.setProperty('--ktm-header-h', header.offsetHeight + 'px');
    syncIslandHeight();
  }

  // In embed the toolbar is a floating island that wraps to 1-3 rows depending on
  // the available canvas width; canvas-side controls derive their offset from it.
  function syncIslandHeight() {
    var bar = $('ktmToolbar');
    if (!bar) return;
    var height = Math.round(bar.getBoundingClientRect().height);
    if (height > 0) document.documentElement.style.setProperty('--ktm-island-h', height + 'px');
  }

  function mountReview() {
    if (EMBED || OFFLINE || !key) return;
    if (!window.ReviewWidget || !ReviewWidget.mount) return;
    ReviewWidget.mount({ file: key, chapter: '', title: map.getAdapter().title || '对话复习' });
  }

  function wireMap() {
    map.on('select', function (node) {
      if (!node) return;
      if (window.ReviewWidget && ReviewWidget.setContext) {
        ReviewWidget.setContext({ chapter: map.getPath(node.id).length > 1 ? map.getPath(node.id)[1] : '' });
      }
    });
    map.on('save', function () { toast('已保存'); });
    map.on('change', function () { updateStats(); });
  }

  (async function boot() {
    try {
      syncThemeUI();
      if (OFFLINE) {
        setText('stats', '离线只读');
        var editBtn = $('btnEdit');
        if (editBtn) editBtn.hidden = true;
        var reviewBtn = $('btnReview');
        if (reviewBtn) reviewBtn.hidden = true;
        var overview = $('btnOverview');
        if (overview) overview.hidden = true;
      }
      var loaded = await fetchTree();
      treeData = loaded.tree;
      key = loaded.key || key;
      rev = loaded.rev || '';
      if (!treeData) throw new Error('知识树为空');
      map = await KTMap.init({
        tree: treeData,
        key: key,
        rev: rev,
        apiBase: API_BASE,
        readonly: READONLY,
        embed: EMBED,
        offline: OFFLINE,
        chapter: params.get('chapter') || '',
        nodeId: params.get('node') || ''
      });
      var loading = $('loading');
      if (loading) loading.hidden = true;
      var layoutSel = $('layoutSelect');
      var expandSel = $('expandLevel');
      var mapState = map.getState();
      if (layoutSel && mapState.layout) layoutSel.value = mapState.layout;
      if (expandSel && mapState.expandLevel) expandSel.value = String(mapState.expandLevel);
      updateStats();
      bindHeader();
      pruneToolSeparators();
      syncHeaderHeight();
      window.addEventListener('resize', syncHeaderHeight);
      if (window.ResizeObserver) {
        var islandObserver = new ResizeObserver(function () { syncIslandHeight(); });
        var toolbarEl = $('ktmToolbar');
        if (toolbarEl) islandObserver.observe(toolbarEl);
      }
      wireMap();
      mountReview();
      if (map.getState().readonly) {
        var edit = $('btnEdit');
        if (edit) { edit.hidden = true; }
      }
      window.__KT_MAP_READY = true;
    } catch (err) {
      console.error(err);
      fail(err && err.message || String(err), err && err.stack ? String(err.stack).split('\n')[0] : '');
    }
  })();
})();
</script>
</body>
</html>
