name: build-windows-portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Build runtime-only portable ZIP
        shell: pwsh
        run: python scripts/build_windows_portable.py --output dist

      - name: Smoke test extracted ZIP
        shell: pwsh
        run: python scripts/smoke_test_windows.py --zip dist/AnythingMindmap-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnythingMindmap-windows-x64
          path: dist/AnythingMindmap-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes
          }
          gh release upload $tag "dist/AnythingMindmap-windows-x64.zip" --clobber
