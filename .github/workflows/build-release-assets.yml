name: build-release-assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/AnythingMindmap-source-${GITHUB_REF_NAME}.zip" HEAD
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist/AnythingMindmap-source-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnythingMindmap ${{ github.ref_name }}
          body: |
            ## AnythingMindmap ${{ github.ref_name }}

            项目源码包，包含 Python 服务、前端资源、启动脚本和测试。

            ### 启动

            - Windows：解压后双击 `start.bat`。首次启动会自动准备 Python 环境和依赖。
            - macOS：解压后双击 `start.command`。
            - 任意平台：安装 `requirements.txt` 后运行 `python start.py`。

            模型与 MinerU 凭证不随压缩包提供，请在应用内“设置”中配置。
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/AnythingMindmap-source-*.zip
