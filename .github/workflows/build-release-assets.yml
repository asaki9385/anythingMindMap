name: build-release-assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/AnythingMindmap-source-${GITHUB_REF_NAME}.zip" HEAD
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist/AnythingMindmap-source-*.zip
          if-no-files-found: error
          retention-days: 30

  macos-dmg:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install relocatable Python 3.12
        run: uv python install 3.12
      - name: Build macOS DMG
        run: |
          PYTHON_BIN="$(uv python find 3.12)"
          RUNTIME_ROOT="$(dirname "$(dirname "$PYTHON_BIN")")"
          python3 scripts/build_macos_dmg.py \
            --runtime-source "$RUNTIME_ROOT" \
            --version "${GITHUB_REF_NAME}" \
            --output dist
      - name: Smoke test DMG
        run: |
          DMG="$(find dist -maxdepth 1 -name 'AnythingMindmap-macos-*.dmg' -print -quit)"
          python3 scripts/smoke_test_macos_dmg.py --dmg "$DMG"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/AnythingMindmap-macos-*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - source-archive
      - macos-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "AnythingMindmap $tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
